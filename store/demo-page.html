<!doctype html>
<!--
  A neutral demo page, used only as the backdrop for the store screenshots.

  Deliberately fictional and unbranded: "Acme" is the standard placeholder, and nothing here
  imitates a real product. It exists because the e2e fixture (tests/e2e/fixtures/host-page.html)
  is deliberately hostile CSS designed to try to break the indicator, which makes it a terrible
  backdrop for a listing.

  Laid out for a 640x400 viewport captured at deviceScaleFactor 2, so the resulting 1280x800 PNG
  shows the indicator at a size someone can actually read in the store.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Orders · Acme Storefront</title>
    <style>
      :root {
        --ink: #1c1917;
        --muted: #78716c;
        --line: #e7e5e4;
        --accent: #1d4ed8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        color: var(--ink);
        background: #fbfbfa;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 20px;
        border-bottom: 1px solid var(--line);
        background: #fff;
      }
      .logo {
        width: 22px; height: 22px; border-radius: 6px;
        background: linear-gradient(135deg, #1d4ed8, #7c3aed);
        flex: none;
      }
      .brand { font-weight: 650; letter-spacing: -0.01em; }
      nav { margin-left: auto; display: flex; gap: 18px; color: var(--muted); font-size: 14px; }
      nav .on { color: var(--ink); font-weight: 600; }
      main { padding: 22px 20px; }
      h1 { font-size: 21px; margin: 0 0 3px; letter-spacing: -0.02em; }
      .sub { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
      .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
      .stat { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
      .stat .k { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
      .stat .v { font-size: 20px; font-weight: 650; letter-spacing: -0.02em; }
      table { width: 100%; border-collapse: collapse; background: #fff;
              border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
      th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.06em;
           color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--line); font-weight: 600; }
      td { padding: 11px 14px; border-bottom: 1px solid #f5f5f4; font-size: 14px; }
      tr:last-child td { border-bottom: 0; }
      .tag { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
      .paid { background: #dcfce7; color: #15803d; }
      .hold { background: #fef3c7; color: #a16207; }
      .num { font-variant-numeric: tabular-nums; color: var(--muted); }
    </style>
  </head>
  <body>
    <header>
      <span class="logo"></span>
      <span class="brand">Acme Storefront</span>
      <nav><span class="on">Orders</span><span>Products</span><span>Customers</span></nav>
    </header>
    <main>
      <h1>Orders</h1>
      <p class="sub">Showing 3 of 1,284 · updated a moment ago</p>

      <div class="stats">
        <div class="stat"><div class="k">Today</div><div class="v">$4,182</div></div>
        <div class="stat"><div class="k">Open orders</div><div class="v">17</div></div>
        <div class="stat"><div class="k">Refunds</div><div class="v">2</div></div>
      </div>

      <table>
        <thead>
          <tr><th>Order</th><th>Customer</th><th>Status</th><th>Total</th></tr>
        </thead>
        <tbody>
          <tr><td class="num">#48120</td><td>R. Okafor</td><td><span class="tag paid">Paid</span></td><td class="num">$248.00</td></tr>
          <tr><td class="num">#48119</td><td>M. Lindqvist</td><td><span class="tag hold">On hold</span></td><td class="num">$92.50</td></tr>
          <tr><td class="num">#48118</td><td>J. Ferreira</td><td><span class="tag paid">Paid</span></td><td class="num">$1,340.00</td></tr>
        </tbody>
      </table>
    </main>
  </body>
</html>
